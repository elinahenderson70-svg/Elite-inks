<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Elite Ink | Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --bg: #080b12;
  --panel: #101622;
  --panel-light: #141d2c;
  --border: #263449;
  --text: #f5f7ff;
  --muted: #91a0b8;
  --blue: #397cff;
  --blue-light: #68a0ff;
  --green: #36d69a;
  --red: #ff657a;
  --radius: 16px;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(
      circle at 50% -15%,
      rgba(57,124,255,.12),
      transparent 38%
    ),
    var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  -webkit-font-smoothing: antialiased;
}

button,
input {
  font: inherit;
}

button {
  border: 1px solid transparent;
  border-radius: 9px;
  padding: 12px 17px;
  font-weight: 700;
  cursor: pointer;
  transition:
    background .2s ease,
    border-color .2s ease,
    transform .2s ease,
    opacity .2s ease;
}

button:hover:not(:disabled) {
  transform: translateY(-1px);
}

button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

button:focus-visible,
input:focus-visible {
  outline: 2px solid var(--blue-light);
  outline-offset: 3px;
}

/* HEADER */

header {
  min-height: 76px;
  padding: 16px 5%;
  border-bottom: 1px solid rgba(91,119,159,.2);
  background: rgba(8,11,18,.9);
  backdrop-filter: blur(14px);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  font-size: 23px;
  font-weight: 900;
  letter-spacing: 2px;
  white-space: nowrap;
}

.logo span {
  color: var(--blue-light);
}

.top-actions {
  display: flex;
  gap: 9px;
  align-items: center;
}

/* BUTTONS */

.primary {
  background: linear-gradient(135deg, #397cff, #2460dc);
  color: white;
  box-shadow: 0 5px 18px rgba(57,124,255,.18);
}

.primary:hover:not(:disabled) {
  background: linear-gradient(135deg, #528cff, #3471ed);
}

.secondary {
  background: #141e2e;
  border-color: #2b3b54;
  color: #e7edfa;
}

.secondary:hover:not(:disabled) {
  background: #1c2a40;
  border-color: #46638e;
}

.approve {
  background: rgba(54,214,154,.12);
  border-color: rgba(54,214,154,.25);
  color: #65e9b5;
}

.approve:hover:not(:disabled) {
  background: rgba(54,214,154,.2);
}

.reject {
  background: rgba(255,101,122,.1);
  border-color: rgba(255,101,122,.23);
  color: #ff91a0;
}

.reject:hover:not(:disabled) {
  background: rgba(255,101,122,.18);
}

/* MAIN LAYOUT */

main {
  width: min(900px, 100%);
  margin: 0 auto;
  padding: 42px 20px 65px;
}

.card {
  background: linear-gradient(
    145deg,
    rgba(18,27,42,.98),
    rgba(13,19,30,.98)
  );
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 27px;
  margin-bottom: 20px;
  box-shadow: 0 12px 35px rgba(0,0,0,.12);
}

h1 {
  font-size: clamp(24px, 4vw, 30px);
  line-height: 1.25;
  margin: 0 0 10px;
  letter-spacing: -.6px;
}

h2 {
  font-size: 20px;
  margin: 0 0 18px;
  letter-spacing: -.2px;
}

p {
  color: var(--muted);
  line-height: 1.7;
  margin: 8px 0;
}

.muted {
  color: var(--muted);
}

/* LOGIN */

#loginSection {
  max-width: 510px;
  margin: 35px auto;
  padding: 35px;
}

#loginSection h1 {
  margin-bottom: 8px;
}

label {
  display: block;
  margin: 20px 0 9px;
  font-size: 13px;
  font-weight: 700;
  color: #dce5f5;
}

input {
  width: 100%;
  padding: 15px 14px;
  color: var(--text);
  background: #090f19;
  border: 1px solid #2a3a51;
  border-radius: 10px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}

input::placeholder {
  color: #61718a;
}

input:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(57,124,255,.12);
}

form .primary {
  width: 100%;
  margin-top: 24px;
  min-height: 49px;
}

#message,
#dashboardMessage {
  margin-top: 14px;
  line-height: 1.6;
  overflow-wrap: anywhere;
  font-size: 13px;
}

.error {
  color: #ff91a0;
}

.success {
  color: #65e9b5;
}

/* DASHBOARD */

#dashboard > .card:first-child {
  background:
    radial-gradient(
      circle at 100% 0%,
      rgba(57,124,255,.12),
      transparent 45%
    ),
    var(--panel);
}

#signedInAs {
  display: inline-block;
  margin-top: 12px;
  padding: 9px 12px;
  background: rgba(57,124,255,.08);
  border: 1px solid rgba(57,124,255,.18);
  border-radius: 8px;
  overflow-wrap: anywhere;
  font-size: 13px;
}

/* CUSTOMER SUBMISSIONS */

.submission {
  background: rgba(7,12,20,.6);
  border: 1px solid #29384e;
  border-radius: 12px;
  padding: 20px;
  margin-top: 15px;
  overflow-wrap: anywhere;
  transition: border-color .2s, background .2s;
}

.submission:hover {
  border-color: #3b5274;
  background: rgba(11,18,29,.9);
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 11px;
  border-radius: 30px;
  font-size: 12px;
  font-weight: 700;
  background: rgba(57,124,255,.12);
  border: 1px solid rgba(57,124,255,.2);
  color: #91b7ff;
  margin-bottom: 15px;
}

.submission .values {
  line-height: 2;
  font-size: 14px;
}

.submission .values strong {
  color: #9cabc2;
  font-weight: 600;
}

.row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 19px;
  padding-top: 15px;
  border-top: 1px solid rgba(91,119,159,.15);
}

.row button {
  flex: 1;
  min-width: 110px;
  min-height: 43px;
}

/* GENERAL */

.hidden {
  display: none !important;
}

#submissions > p {
  padding: 12px 0;
}

@media (max-width: 600px) {
  header {
    min-height: 68px;
    padding: 14px 16px;
  }

  .logo {
    font-size: 19px;
    letter-spacing: 1.5px;
  }

  .top-actions {
    gap: 6px;
  }

  button {
    padding: 11px 12px;
  }

  main {
    padding: 25px 13px 45px;
  }

  .card {
    padding: 19px;
    border-radius: 13px;
  }

  #loginSection {
    padding: 23px 19px;
    margin: 20px auto;
  }

  .submission {
    padding: 15px;
  }

  .row {
    gap: 8px;
  }

  .row button {
    min-width: 95px;
  }
}

@media (max-width: 360px) {
  .logo {
    font-size: 16px;
  }

  .top-actions button {
    padding: 10px 8px;
    font-size: 12px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">ELITE <span>INK</span></div>

  <div class="top-actions">
    <button id="refreshBtn" class="secondary hidden" type="button">
      Refresh
    </button>

    <button id="logoutBtn" class="secondary hidden" type="button">
      Logout
    </button>
  </div>
</header>

<main>

  <section id="loginSection" class="card">
    <h1>Admin Login</h1>
    <p>Sign in to review customer verification submissions.</p>

    <form id="loginForm">
      <label for="email">Admin email</label>

      <input
        id="email"
        type="email"
        autocomplete="username"
        placeholder="Enter your admin email"
        required
      >

      <label for="password">Password</label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Enter your password"
        required
      >

      <button id="loginBtn" class="primary" type="submit">
        Sign In
      </button>

      <div id="message" role="status" aria-live="polite"></div>
    </form>
  </section>

  <section id="dashboard" class="hidden">

    <div class="card">
      <h1>Admin Dashboard</h1>
      <p>Review submissions and approve or reject each one.</p>

      <p id="signedInAs" class="muted"></p>

      <div
        id="dashboardMessage"
        role="status"
        aria-live="polite"
      ></div>
    </div>

    <div class="card">
      <h2>Customer Submissions</h2>

      <div id="submissions">
        <p>Loading submissions...</p>
      </div>
    </div>

  </section>

</main>

<script>
(() => {
  "use strict";

  const SUPABASE_URL =
    "https://nywvzauhxzegbwwipdqi.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_Wech5BynoPAXAl90h0XjXw_dudU5jpC";

  const $ = (id) => document.getElementById(id);

  const loginSection = $("loginSection");
  const dashboard = $("dashboard");
  const loginForm = $("loginForm");
  const loginBtn = $("loginBtn");
  const message = $("message");
  const dashboardMessage = $("dashboardMessage");
  const submissions = $("submissions");

  function showMessage(element, text, type = "") {
    element.textContent = text;
    element.className = type;
  }

  function setLoggedIn(user) {
    loginSection.classList.add("hidden");
    dashboard.classList.remove("hidden");

    $("logoutBtn").classList.remove("hidden");
    $("refreshBtn").classList.remove("hidden");

    $("signedInAs").textContent =
      "Signed in as: " + user.email;
  }

  function setLoggedOut() {
    loginSection.classList.remove("hidden");
    dashboard.classList.add("hidden");

    $("logoutBtn").classList.add("hidden");
    $("refreshBtn").classList.add("hidden");

    loginForm.reset();

    showMessage(message, "");
    showMessage(dashboardMessage, "");
  }

  if (
    !window.supabase ||
    !window.supabase.createClient
  ) {
    showMessage(
      message,
      "Supabase library did not load. Check your internet connection and reopen this page.",
      "error"
    );

    loginBtn.disabled = true;
    return;
  }

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  async function loadSubmissions() {
    submissions.replaceChildren();

    const loading = document.createElement("p");
    loading.textContent = "Loading submissions...";

    submissions.appendChild(loading);

    showMessage(dashboardMessage, "");

    try {
      const { data, error } = await db
        .from("elite_ink_verifications")
        .select("id,x_num,xx_num,xxx_num,status,created_at")
        .order("created_at", { ascending: false });

      if (error) throw error;

      submissions.replaceChildren();

      if (!data || data.length === 0) {
        const empty = document.createElement("p");
        empty.textContent = "No submissions found yet.";

        submissions.appendChild(empty);
        return;
      }

      data.forEach((item) => {
        const card = document.createElement("article");
        card.className = "submission";

        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = "Status: " + item.status;

        card.appendChild(badge);

        const values = document.createElement("div");
        values.className = "values";

        const lines = [
          ["x.num", item.x_num],
          ["xx.num", item.xx_num],
          ["xxx.num", item.xxx_num],
          [
            "Submitted",
            item.created_at
              ? new Date(item.created_at).toLocaleString()
              : "Unknown"
          ]
        ];

        lines.forEach(([label, value]) => {
          const line = document.createElement("div");

          const strong = document.createElement("strong");
          strong.textContent = label + ": ";

          line.appendChild(strong);

          line.appendChild(
            document.createTextNode(String(value ?? ""))
          );

          values.appendChild(line);
        });

        card.appendChild(values);

        if (item.status === "pending") {
          const row = document.createElement("div");
          row.className = "row";

          const approveBtn = document.createElement("button");
          approveBtn.type = "button";
          approveBtn.className = "approve";
          approveBtn.textContent = "Approve";

          const rejectBtn = document.createElement("button");
          rejectBtn.type = "button";
          rejectBtn.className = "reject";
          rejectBtn.textContent = "Reject";

          approveBtn.addEventListener("click", () =>
            updateStatus(
              item.id,
              "approved",
              approveBtn,
              rejectBtn
            )
          );

          rejectBtn.addEventListener("click", () =>
            updateStatus(
              item.id,
              "rejected",
              approveBtn,
              rejectBtn
            )
          );

          row.append(approveBtn, rejectBtn);
          card.appendChild(row);
        }

        submissions.appendChild(card);
      });

      showMessage(
        dashboardMessage,
        "Submissions loaded.",
        "success"
      );

    } catch (error) {
      submissions.replaceChildren();

      const errorText = document.createElement("p");
      errorText.className = "error";
      errorText.textContent =
        error.message || "Could not load submissions.";

      submissions.appendChild(errorText);

      showMessage(
        dashboardMessage,
        "Check your admin permissions and database policies.",
        "error"
      );
    }
  }

  async function updateStatus(
    id,
    status,
    approveBtn,
    rejectBtn
  ) {
    approveBtn.disabled = true;
    rejectBtn.disabled = true;

    showMessage(
      dashboardMessage,
      "Updating submission..."
    );

    try {
      const { data, error } = await db
        .from("elite_ink_verifications")
        .update({ status })
        .eq("id", id)
        .eq("status", "pending")
        .select("id");

      if (error) throw error;

      if (!data || data.length === 0) {
        throw new Error(
          "No row updated. Check admin permissions or refresh the list."
        );
      }

      showMessage(
        dashboardMessage,
        "Submission " + status + " successfully.",
        "success"
      );

      await loadSubmissions();

    } catch (error) {
      showMessage(
        dashboardMessage,
        error.message || "Update failed.",
        "error"
      );

      approveBtn.disabled = false;
      rejectBtn.disabled = false;
    }
  }

  loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    loginBtn.disabled = true;
    loginBtn.textContent = "Signing in...";

    showMessage(message, "Connecting to Supabase...");

    const email = $("email").value.trim();
    const password = $("password").value;

    try {
      const { data, error } = await db.auth.signInWithPassword({
        email,
        password
      });

      if (error) throw error;

      if (!data.user) {
        throw new Error(
          "Login did not return a user account."
        );
      }

      setLoggedIn(data.user);

      await loadSubmissions();

    } catch (error) {
      showMessage(
        message,
        error.message ||
          "Login failed. Check your email and password.",
        "error"
      );

    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = "Sign In";
    }
  });

  $("refreshBtn").addEventListener(
    "click",
    loadSubmissions
  );

  $("logoutBtn").addEventListener("click", async () => {
    const { error } = await db.auth.signOut();

    if (error) {
      showMessage(
        dashboardMessage,
        error.message,
        "error"
      );
      return;
    }

    setLoggedOut();
  });

  async function restoreSession() {
    const { data, error } = await db.auth.getSession();

    if (error) {
      showMessage(message, error.message, "error");
      return;
    }

    if (data.session && data.session.user) {
      setLoggedIn(data.session.user);
      await loadSubmissions();
    }
  }

  db.auth.onAuthStateChange((event, session) => {
    if (event === "SIGNED_OUT" || !session) {
      setLoggedOut();
    }
  });

  restoreSession();

})();
</script>

</body>
</html>
